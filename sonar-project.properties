# SonarQube analysis configuration for the Code Quality stage.
sonar.projectKey=wam-pantry
sonar.projectName=WAM Pantry API
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,monitoring/notifier
sonar.tests=tests
sonar.exclusions=**/node_modules/**,coverage/**,reports/**,dist/**

# Coverage is measured for application code; ops scripts are verified by the
# pipeline itself (and security-summary has its own unit tests).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/server.js,scripts/**,monitoring/**

# Test files naturally repeat setup code; don't count them as duplication.
sonar.cpd.exclusions=tests/**

# Import ESLint findings so code-style issues appear alongside Sonar's own rules.
sonar.eslint.reportPaths=reports/eslint.json

# Jenkins waits for the quality gate via the webhook (waitForQualityGate).
sonar.qualitygate.wait=false
